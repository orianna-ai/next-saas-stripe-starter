name: Softlight preview demo
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ./.github/actions/softlight-capture
        with:
          config-path: .softlight/review.yml
          preview: "true"
          preview-hold-seconds: "1200"
          skip-capture-plan: "true"
          review-optional: "true"
